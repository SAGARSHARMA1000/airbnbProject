<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="airbnbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="100%" stop-color="#E00B41" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="960" fill="url(#bgGrad)" />

  <!-- Header Section -->
  <g transform="translate(60, 40)">
    <rect width="40" height="40" rx="8" fill="url(#airbnbGrad)" />
    <!-- Airbnb Logo Shape -->
    <path d="M20 6c2.5 0 4.3 1.2 5.9 4.1l.6 1.2c3.8 7.2 9.8 19.2 9.8 22.8 0 5.8-4.5 9.4-10.6 9.4-3.8 0-6.8-1.8-9.5-5.1C13.5 41.8 10.5 43.5 6.7 43.5 4.4 43.5 2.5 41.6 2.5 34.1c0-3.6 5.9-15.6 9.8-22.8l.6-1.2C14.6 7.2 16.4 6 18.9 6h1.1z" fill="#ffffff" transform="translate(3, -2) scale(0.85)"/>
    <text x="56" y="26" fill="#ffffff" font-size="22" font-weight="700" letter-spacing="-0.5">VACATION RENTAL MARKETPLACE — SYSTEM ARCHITECTURE</text>
    <text x="56" y="46" fill="#94a3b8" font-size="13">High-Scale Global Distributed Systems Design (50M+ MAU · Redlock Concurrency · Geo-Spatial Search)</text>
  </g>

  <!-- 1. Client Layer -->
  <g transform="translate(60, 120)">
    <rect width="1280" height="90" rx="16" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-dasharray="4 4" />
    <text x="20" y="24" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1">1. CLIENT &amp; INGESTION LAYER</text>

    <!-- Cards -->
    <g transform="translate(30, 36)">
      <rect width="360" height="42" rx="8" fill="#1e293b" stroke="#475569" filter="url(#dropShadow)"/>
      <text x="16" y="26" fill="#f8fafc" font-size="13" font-weight="600">Web Client (Next.js 14+ SSR / Edge)</text>
    </g>
    <g transform="translate(460, 36)">
      <rect width="360" height="42" rx="8" fill="#1e293b" stroke="#475569" filter="url(#dropShadow)"/>
      <text x="16" y="26" fill="#f8fafc" font-size="13" font-weight="600">Mobile Apps (iOS &amp; Android Native)</text>
    </g>
    <g transform="translate(890, 36)">
      <rect width="360" height="42" rx="8" fill="#1e293b" stroke="#475569" filter="url(#dropShadow)"/>
      <text x="16" y="26" fill="#f8fafc" font-size="13" font-weight="600">Host Management &amp; Partner APIs</text>
    </g>
  </g>

  <!-- Connectors from Clients to Edge -->
  <line x1="270" y1="210" x2="270" y2="245" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="700" y1="210" x2="700" y2="245" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1130" y1="210" x2="1130" y2="245" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 2. Edge & Security Tier -->
  <g transform="translate(60, 250)">
    <rect width="1280" height="85" rx="16" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-dasharray="4 4" />
    <text x="20" y="24" fill="#a855f7" font-size="12" font-weight="700" letter-spacing="1">2. EDGE ROUTING, SECURITY &amp; ACCELERATION</text>

    <g transform="translate(30, 34)">
      <rect width="580" height="40" rx="8" fill="#1e293b" stroke="#6b21a8" filter="url(#dropShadow)"/>
      <text x="20" y="25" fill="#f3e8ff" font-size="13" font-weight="600">Cloudflare / Fastly Anycast CDN (Edge SSR Caching · Image Optimization · DDoS WAF)</text>
    </g>
    <g transform="translate(670, 34)">
      <rect width="580" height="40" rx="8" fill="#1e293b" stroke="#6b21a8" filter="url(#dropShadow)"/>
      <text x="20" y="25" fill="#f3e8ff" font-size="13" font-weight="600">Envoy API Gateway (JWT Auth · Token-Bucket Rate Limiter · gRPC Dispatcher)</text>
    </g>
  </g>

  <!-- Connectors to Services -->
  <line x1="700" y1="335" x2="700" y2="375" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 3. Microservices Core Layer -->
  <g transform="translate(60, 380)">
    <rect width="1280" height="190" rx="16" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-dasharray="4 4" />
    <text x="20" y="24" fill="#34d399" font-size="12" font-weight="700" letter-spacing="1">3. CORE MICROSERVICES DOMAIN</text>

    <!-- Row 1 Services -->
    <g transform="translate(30, 38)">
      <rect width="280" height="60" rx="10" fill="#0f172a" stroke="#059669" filter="url(#dropShadow)"/>
      <text x="16" y="26" fill="#ffffff" font-size="13" font-weight="700">Listing &amp; Media Service</text>
      <text x="16" y="46" fill="#94a3b8" font-size="11">Metadata, Amenities &amp; Ingestion</text>
    </g>
    <g transform="translate(340, 38)">
      <rect width="280" height="60" rx="10" fill="#0f172a" stroke="#059669" filter="url(#dropShadow)"/>
      <text x="16" y="26" fill="#ffffff" font-size="13" font-weight="700">Search &amp; Discovery Engine</text>
      <text x="16" y="46" fill="#94a3b8" font-size="11">H3 Spatial Indexing &amp; Filters</text>
    </g>
    <g transform="translate(650, 38)">
      <rect width="280" height="60" rx="10" fill="#0f172a" stroke="#e11d48" filter="url(#dropShadow)"/>
      <text x="16" y="26" fill="#ffffff" font-size="13" font-weight="700">Reservation &amp; Booking Svc</text>
      <text x="16" y="46" fill="#fca5a5" font-size="11">Redlock Distributed Locking</text>
    </g>
    <g transform="translate(960, 38)">
      <rect width="290" height="60" rx="10" fill="#0f172a" stroke="#059669" filter="url(#dropShadow)"/>
      <text x="16" y="26" fill="#ffffff" font-size="13" font-weight="700">Dynamic Pricing Engine</text>
      <text x="16" y="46" fill="#94a3b8" font-size="11">Real-time Rates &amp; Currency FX</text>
    </g>

    <!-- Row 2 Services -->
    <g transform="translate(30, 112)">
      <rect width="280" height="60" rx="10" fill="#0f172a" stroke="#059669" filter="url(#dropShadow)"/>
      <text x="16" y="26" fill="#ffffff" font-size="13" font-weight="700">User &amp; Auth Service</text>
      <text x="16" y="46" fill="#94a3b8" font-size="11">OAuth2, MFA &amp; Superhost Badging</text>
    </g>
    <g transform="translate(340, 112)">
      <rect width="280" height="60" rx="10" fill="#0f172a" stroke="#059669" filter="url(#dropShadow)"/>
      <text x="16" y="26" fill="#ffffff" font-size="13" font-weight="700">Reviews &amp; Trust Platform</text>
      <text x="16" y="46" fill="#94a3b8" font-size="11">6-Category Verified Moderation</text>
    </g>
    <g transform="translate(650, 112)">
      <rect width="280" height="60" rx="10" fill="#0f172a" stroke="#059669" filter="url(#dropShadow)"/>
      <text x="16" y="26" fill="#ffffff" font-size="13" font-weight="700">Real-Time Messaging</text>
      <text x="16" y="46" fill="#94a3b8" font-size="11">WebSockets, Chat &amp; Push Alerts</text>
    </g>
    <g transform="translate(960, 112)">
      <rect width="290" height="60" rx="10" fill="#0f172a" stroke="#059669" filter="url(#dropShadow)"/>
      <text x="16" y="26" fill="#ffffff" font-size="13" font-weight="700">Payments &amp; Escrow Service</text>
      <text x="16" y="46" fill="#94a3b8" font-size="11">Stripe/Adyen Multi-party Payouts</text>
    </g>
  </g>

  <!-- Connectors to Event Bus & DB -->
  <line x1="200" y1="570" x2="200" y2="605" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="790" y1="570" x2="790" y2="605" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1100" y1="570" x2="1100" y2="605" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 4. Event Bus & Asynchronous Pipelines -->
  <g transform="translate(60, 610)">
    <rect width="1280" height="70" rx="16" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-dasharray="4 4" />
    <text x="20" y="22" fill="#fbbf24" font-size="12" font-weight="700" letter-spacing="1">4. ASYNCHRONOUS EVENT BUS &amp; DATA PIPELINES</text>

    <g transform="translate(30, 30)">
      <rect width="1220" height="30" rx="6" fill="#451a03" stroke="#d97706" />
      <text x="20" y="20" fill="#fef3c7" font-size="12" font-weight="600">Apache Kafka Topics:  [booking-events] · [inventory-locked] · [listing-indexing] · [payment-confirmed] · [chat-messages] · [analytics-etl]</text>
    </g>
  </g>

  <!-- Connectors to Storage Tier -->
  <line x1="700" y1="680" x2="700" y2="715" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 5. Persistence & Storage Layer -->
  <g transform="translate(60, 720)">
    <rect width="1280" height="110" rx="16" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-dasharray="4 4" />
    <text x="20" y="22" fill="#f43f5e" font-size="12" font-weight="700" letter-spacing="1">5. PERSISTENCE &amp; DISTRIBUTED STORAGE LAYER</text>

    <g transform="translate(30, 34)">
      <rect width="220" height="60" rx="8" fill="#1e293b" stroke="#e11d48" filter="url(#dropShadow)"/>
      <text x="14" y="24" fill="#ffffff" font-size="12" font-weight="700">Sharded PostgreSQL</text>
      <text x="14" y="42" fill="#fda4af" font-size="10">Citus Cluster · ACID Bookings</text>
    </g>
    <g transform="translate(280, 34)">
      <rect width="220" height="60" rx="8" fill="#1e293b" stroke="#e11d48" filter="url(#dropShadow)"/>
      <text x="14" y="24" fill="#ffffff" font-size="12" font-weight="700">Redis Enterprise Cluster</text>
      <text x="14" y="42" fill="#fda4af" font-size="10">Distributed Redlock &amp; Sessions</text>
    </g>
    <g transform="translate(530, 34)">
      <rect width="220" height="60" rx="8" fill="#1e293b" stroke="#e11d48" filter="url(#dropShadow)"/>
      <text x="14" y="24" fill="#ffffff" font-size="12" font-weight="700">OpenSearch / Elastic</text>
      <text x="14" y="42" fill="#fda4af" font-size="10">Geospatial Search &amp; Discovery</text>
    </g>
    <g transform="translate(780, 34)">
      <rect width="220" height="60" rx="8" fill="#1e293b" stroke="#e11d48" filter="url(#dropShadow)"/>
      <text x="14" y="24" fill="#ffffff" font-size="12" font-weight="700">DynamoDB / Cassandra</text>
      <text x="14" y="42" fill="#fda4af" font-size="10">Chat History &amp; Audit Logs</text>
    </g>
    <g transform="translate(1030, 34)">
      <rect width="220" height="60" rx="8" fill="#1e293b" stroke="#e11d48" filter="url(#dropShadow)"/>
      <text x="14" y="24" fill="#ffffff" font-size="12" font-weight="700">AWS S3 / Cloudflare R2</text>
      <text x="14" y="42" fill="#fda4af" font-size="10">High-Res Gallery Photos</text>
    </g>
  </g>

  <!-- 6. Observability & SRE Footer -->
  <g transform="translate(60, 850)">
    <rect width="1280" height="70" rx="12" fill="#0f172a" stroke="#334155" />
    <text x="24" y="28" fill="#94a3b8" font-size="12" font-weight="700">6. SRE, OBSERVABILITY &amp; DEPLOYMENT STRATEGY</text>
    <text x="24" y="48" fill="#64748b" font-size="11">OpenTelemetry Distributed Tracing · Prometheus &amp; Grafana Metrics · Kubernetes Multi-Region Cluster · Automated Blue/Green Deployments</text>
    <rect x="1100" y="20" width="150" height="30" rx="6" fill="#FF385C" />
    <text x="1175" y="40" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">99.99% SLO UPTIME</text>
  </g>
</svg>
